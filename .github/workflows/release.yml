name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Check release version and scripts
        run: |
          python3 -m unittest discover -s tests
          python3 -c 'import os, tomllib; assert os.environ["GITHUB_REF_NAME"] == "v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"], "Tag must match Cargo.toml version"'
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$TARGET"
      - name: Test and build
        run: |
          cargo test --locked
          ./build.sh "$TARGET"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "target/$TARGET/release/homebrew-gui.app" "dist/homebrew-gui-$GITHUB_REF_NAME-macos-$ARCH.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: macos-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s "dist/homebrew-gui-$GITHUB_REF_NAME-macos-arm64.zip"
          test -s "dist/homebrew-gui-$GITHUB_REF_NAME-macos-x86_64.zip"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --generate-notes --title "Homebrew GUI $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false
